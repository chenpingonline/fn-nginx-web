name: Compile Nginx 1.30.4 static binaries

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/compile-nginx-static.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.output_arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            output_arch: x86_64
          - platform: linux/arm64
            output_arch: aarch64
    env:
      NGINX_VERSION: 1.30.4
      SOURCE_SHA: 4261dc90e9e47c1c4041276e9aaa3d48ebe2e664f728e14fa95ae6c67d57a08b
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create reproducible static-build Dockerfile
        run: |
          cat > /tmp/Dockerfile.nginx-static <<'DOCKERFILE'
          # syntax=docker/dockerfile:1
          FROM alpine:3.21 AS build
          ARG NGINX_VERSION
          ARG SOURCE_SHA
          ARG OUTPUT_ARCH
          ENV SOURCE_DATE_EPOCH=1786814640
          RUN apk add --no-cache \
                build-base linux-headers curl ca-certificates file binutils \
                openssl-dev openssl-libs-static pcre-dev zlib-dev zlib-static
          WORKDIR /build
          RUN curl -fL --retry 5 --retry-delay 2 \
                -o nginx.tar.gz "https://nginx.org/download/nginx-${NGINX_VERSION}.tar.gz" \
              && echo "${SOURCE_SHA}  nginx.tar.gz" | sha256sum -c - \
              && sha256sum nginx.tar.gz > nginx-source.sha256 \
              && tar -xzf nginx.tar.gz
          WORKDIR /build/nginx-${NGINX_VERSION}
          RUN ./configure \
                --prefix=. \
                --sbin-path=nginx \
                --conf-path=nginx.conf \
                --pid-path=nginx.pid \
                --lock-path=nginx.lock \
                --error-log-path=stderr \
                --http-log-path=access.log \
                --http-client-body-temp-path=client_body_temp \
                --http-proxy-temp-path=proxy_temp \
                --http-fastcgi-temp-path=fastcgi_temp \
                --http-uwsgi-temp-path=uwsgi_temp \
                --http-scgi-temp-path=scgi_temp \
                --user=nobody \
                --group=nogroup \
                --with-cc-opt='-Os -fomit-frame-pointer -pipe' \
                --with-ld-opt='-static -Wl,--as-needed' \
                --with-threads \
                --with-file-aio \
                --with-http_ssl_module \
                --with-http_v2_module \
                --with-http_realip_module \
                --with-http_stub_status_module \
                --with-http_auth_request_module \
                --with-http_secure_link_module \
                --with-stream \
                --with-stream_ssl_module \
                --with-stream_realip_module \
                --with-stream_ssl_preread_module \
              && make -j2 \
              && strip objs/nginx \
              && file objs/nginx \
              && ldd objs/nginx 2>&1 || true
          RUN mkdir -p /out \
              && install -m 0755 objs/nginx "/out/nginx-${NGINX_VERSION}-${OUTPUT_ARCH}-linux-static" \
              && cp /build/nginx-source.sha256 /out/ \
              && "/out/nginx-${NGINX_VERSION}-${OUTPUT_ARCH}-linux-static" -V \
                    > "/out/nginx-${NGINX_VERSION}-${OUTPUT_ARCH}-linux-static.build-info.txt" 2>&1 \
              && file "/out/nginx-${NGINX_VERSION}-${OUTPUT_ARCH}-linux-static" \
                    > "/out/nginx-${NGINX_VERSION}-${OUTPUT_ARCH}-linux-static.file.txt" \
              && cd /out \
              && sha256sum "nginx-${NGINX_VERSION}-${OUTPUT_ARCH}-linux-static" \
                    > "nginx-${NGINX_VERSION}-${OUTPUT_ARCH}-linux-static.sha256"
          FROM scratch
          COPY --from=build /out/ /
          DOCKERFILE

      - name: Compile official Nginx source
        run: |
          rm -rf output
          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --build-arg "NGINX_VERSION=${NGINX_VERSION}" \
            --build-arg "SOURCE_SHA=${SOURCE_SHA}" \
            --build-arg "OUTPUT_ARCH=${{ matrix.output_arch }}" \
            --provenance=false \
            --no-cache \
            --output type=local,dest=output \
            -f /tmp/Dockerfile.nginx-static .

      - name: Verify compiled binary
        run: |
          set -eux
          binary="output/nginx-${NGINX_VERSION}-${{ matrix.output_arch }}-linux-static"
          test -x "$binary"
          file "$binary"
          grep -q 'statically linked' "${binary}.file.txt"
          grep -q "nginx/${NGINX_VERSION}" "${binary}.build-info.txt"
          grep -q -- '--group=nogroup' "${binary}.build-info.txt"
          grep -q -- '--with-http_ssl_module' "${binary}.build-info.txt"
          grep -q -- '--with-http_v2_module' "${binary}.build-info.txt"
          grep -q -- '--with-stream' "${binary}.build-info.txt"
          grep -q -- '--with-stream_ssl_preread_module' "${binary}.build-info.txt"
          (cd output && sha256sum -c "$(basename "${binary}.sha256")")
          cat "${binary}.build-info.txt"
          cat "${binary}.sha256"

      - name: Upload compiled binary
        uses: actions/upload-artifact@v4
        with:
          name: nginx-1.30.4-${{ matrix.output_arch }}-linux-static
          path: output/*
          if-no-files-found: error

  publish:
    name: Publish compiled binaries
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download compiled binaries
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Inspect release files
        run: |
          ls -lah release
          cat release/*.sha256

      - name: Publish Nginx core release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: nginx-core-1.30.4-r2
        run: |
          set -e
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Fn-Nginx Nginx core 1.30.4 r2" \
              --notes "Nginx 1.30.4 compiled from the official nginx.org source for Linux x86_64 and AArch64. Both binaries use identical modules, static musl/OpenSSL/PCRE/zlib linking, and Debian-compatible default group nogroup."
          fi
