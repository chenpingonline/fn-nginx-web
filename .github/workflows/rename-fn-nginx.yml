name: One-time rename to Fn-Nginx

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rename-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: false

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y file binutils curl python3 openssl

      - name: Rename product and FPK artifacts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          brand_files = [
              'README.md',
              'NOTICE',
              'THIRD_PARTY_LICENSES.md',
              'fnos/NOTICE',
              'fnos/THIRD_PARTY_LICENSES.md',
              'fnos/manifest',
              'fnos/app/ui/config',
              'fnos/cmd/main',
              'fnos/cmd/install_callback',
              'fnos/cmd/upgrade_callback',
              'fnos/wizard/README',
              'main.go',
              'types.go',
              'web/index.html',
              'web/app.js',
              'tests/fpk-lifecycle.sh',
              'scripts/verify-fpk.sh',
              '.github/workflows/build.yml',
          ]

          for filename in brand_files:
              path = Path(filename)
              text = path.read_text()
              path.write_text(text.replace('FnProxy', 'Fn-Nginx'))

          # Keep the request header and internal application ID unchanged so
          # upgrades from the existing test build retain data and routes.
          app_js = Path('web/app.js')
          app_js.write_text(app_js.read_text().replace('X-Fn-Nginx-Request', 'X-FnProxy-Request'))

          build = Path('scripts/build.sh')
          text = build.read_text()
          text = text.replace(
              'FPK_NAME="fnproxy-${VERSION}-${OUTPUT_ARCH}.fpk"',
              'FPK_NAME="Fn-Nginx-${VERSION}-${OUTPUT_ARCH}.fpk"',
          )
          build.write_text(text)

          release = Path('scripts/release.sh')
          text = release.read_text()
          text = text.replace('fnproxy-${VERSION}-x86.fpk', 'Fn-Nginx-${VERSION}-x86.fpk')
          text = text.replace('fnproxy-${VERSION}-arm64.fpk', 'Fn-Nginx-${VERSION}-arm64.fpk')
          text = text.replace('Release artifacts created', 'Fn-Nginx release artifacts created')
          release.write_text(text)

          readme = Path('README.md')
          text = readme.read_text()
          text = text.replace('dist/fnproxy-0.1.0-x86.fpk', 'dist/Fn-Nginx-0.1.0-x86.fpk')
          text = text.replace('dist/fnproxy-0.1.0-arm64.fpk', 'dist/Fn-Nginx-0.1.0-arm64.fpk')
          marker = 'Fn-Nginx 只使用自己的 `TRIM_APPDEST`、`TRIM_PKGETC`、`TRIM_PKGVAR` 和 `TRIM_PKGTMP` 目录，不会访问 `/etc/nginx`、`/usr/trim/nginx`，也不会执行 `systemctl restart nginx`。'
          note = '\n\n> 为兼容已经安装的测试版，内部应用 ID、统一网关路径和运行用户仍保留为 `fnproxy`；这不会影响桌面展示名称和 FPK 文件名。'
          if marker in text and note.strip() not in text:
              text = text.replace(marker, marker + note)
          readme.write_text(text)

          workflow = Path('.github/workflows/build.yml')
          text = workflow.read_text()
          text = text.replace('fnproxy-0.1.0-x86.fpk', 'Fn-Nginx-0.1.0-x86.fpk')
          text = text.replace('fnproxy-0.1.0-arm64.fpk', 'Fn-Nginx-0.1.0-arm64.fpk')
          text = text.replace('name: fnproxy-x86', 'name: Fn-Nginx-x86')
          text = text.replace('name: fnproxy-arm64', 'name: Fn-Nginx-arm64')
          workflow.write_text(text)

          manifest = Path('fnos/manifest')
          text = manifest.read_text()
          text = re.sub(
              r'^changelog\s*=.*$',
              'changelog                  = 软件名称更新为 Fn-Nginx；FPK 产物名称同步调整，保留内部应用 ID 以兼容既有数据。',
              text,
              flags=re.MULTILINE,
          )
          manifest.write_text(text)

          assert 'appname                    = fnproxy' in manifest.read_text()
          assert 'display_name               = Fn-Nginx' in manifest.read_text()
          assert 'gatewayPrefix": "/app/fnproxy"' in Path('fnos/app/ui/config').read_text()
          assert 'X-FnProxy-Request' in app_js.read_text()
          assert 'Fn-Nginx-${VERSION}-${OUTPUT_ARCH}.fpk' in build.read_text()
          assert 'Fn-Nginx-0.1.0-x86.fpk' in workflow.read_text()
          assert 'Fn-Nginx-0.1.0-arm64.fpk' in workflow.read_text()
          assert 'fnproxy-0.1.0-x86.fpk' not in workflow.read_text()
          assert 'fnproxy-0.1.0-arm64.fpk' not in workflow.read_text()
          PY

      - name: Format and validate source
        run: |
          gofmt -w main.go types.go
          chmod +x scripts/*.sh tests/*.sh fnos/cmd/*
          go test ./...
          node --check web/app.js
          bash -n scripts/*.sh tests/*.sh fnos/cmd/*
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags='-s -w' -o /tmp/fn-nginx-test .
          /tmp/fn-nginx-test version | grep -F 'Fn-Nginx 0.1.0 (Nginx 1.30.4)'

      - name: Build and verify x86 FPK
        run: |
          ./scripts/build.sh x86
          ./tests/integration.sh
          ./tests/fpk-lifecycle.sh dist/Fn-Nginx-0.1.0-x86.fpk

      - name: Build and verify ARM64 FPK
        run: ./scripts/build.sh arm64

      - name: Check renamed artifacts
        run: |
          test -f dist/Fn-Nginx-0.1.0-x86.fpk
          test -f dist/Fn-Nginx-0.1.0-arm64.fpk
          test -f dist/Fn-Nginx-0.1.0-x86.fpk.sha256
          test -f dist/Fn-Nginx-0.1.0-arm64.fpk.sha256

      - name: Upload renamed FPK packages
        uses: actions/upload-artifact@v4
        with:
          name: Fn-Nginx-0.1.0-fpk
          path: |
            dist/Fn-Nginx-0.1.0-x86.fpk
            dist/Fn-Nginx-0.1.0-x86.fpk.sha256
            dist/Fn-Nginx-0.1.0-arm64.fpk
            dist/Fn-Nginx-0.1.0-arm64.fpk.sha256

      - name: Commit source rename
        run: |
          # GitHub's workflow token cannot update workflow files. Restore them
          # here; the connector updates build.yml and removes this temporary
          # workflow in separate API commits after the source push succeeds.
          git checkout HEAD -- .github/workflows/build.yml .github/workflows/rename-fn-nginx.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No source changes to commit'; exit 1; }
          git commit -m 'refactor: rename application and FPK artifacts to Fn-Nginx [skip ci]'
          git push origin HEAD:main
